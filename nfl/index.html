<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAVV NFL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<style>
:root{
  --bg:#05070d;
  --card:#0b1220;
  --card2:#060a14;
  --border:#17233b;
  --text:#e8f0ff;
  --muted:#8aa0bf;
  --blue:#3b82f6;
  --blue2:#2563eb;
  --light-blue:#60a5fa;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:84px;
}
header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
  gap:10px;
}
header b{
  display:block;
  font-size:22px;
  color:var(--light-blue);
  letter-spacing:.02em;
}
header small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}
main{
  max-width:1050px;
  margin:auto;
  padding:14px;
}
.tab{display:none}
.tab.on{display:block}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}
.card h2{
  margin:0 0 12px;
  font-size:12px;
  letter-spacing:.14em;
  color:var(--light-blue);
  text-transform:uppercase;
}
label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:10px 0 4px;
  letter-spacing:.06em;
  text-transform:uppercase;
}
select{
  width:100%;
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  font-size:16px;
}
.sel{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
}
.rival{
  display:flex;
  gap:12px;
  align-items:center;
  background:var(--card2);
  border-radius:14px;
  padding:12px;
  margin-top:14px;
}
.circ{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#0b1b3a;
  border:2px solid var(--blue);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:13px;
  color:#93c5fd;
  flex:none;
}
.rival small{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.1em;
}
.btn{
  width:100%;
  margin-top:14px;
  border:0;
  border-radius:16px;
  padding:16px;
  font-size:18px;
  font-weight:800;
  color:#fff;
  background:linear-gradient(90deg,var(--blue2),var(--light-blue));
  box-shadow:0 0 24px #3b82f655;
  cursor:pointer;
}
.phead{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding-bottom:12px;
}
.phead b{font-size:19px}
.phead small{
  display:block;
  color:var(--light-blue);
  margin-top:4px;
}
.hero{
  text-align:center;
  padding:18px 0 6px;
}
.hero small{
  letter-spacing:.14em;
  color:var(--light-blue);
  text-transform:uppercase;
  font-size:12px;
}
.hero .n{
  font-size:64px;
  font-weight:800;
  color:#bfdbfe;
  line-height:1.1;
}
.bar{
  position:relative;
  height:10px;
  background:#101a2e;
  border-radius:6px;
  margin:10px 4px 4px;
}
.bar i{
  position:absolute;
  top:0;
  bottom:0;
  border-radius:6px;
  background:linear-gradient(90deg,var(--blue2),var(--light-blue));
}
.bar u{
  position:absolute;
  top:-4px;
  bottom:-4px;
  width:3px;
  background:#fff;
}
.fc{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}
.tiles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.tile{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  text-align:center;
}
.tile small{
  display:block;
  color:var(--light-blue);
  font-weight:700;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.tile b{
  display:block;
  font-size:28px;
  margin-top:6px;
}
.tile span{
  color:var(--muted);
  font-size:11px;
}
.disc{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  margin-top:16px;
  line-height:1.5;
}
.scroll{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:8px 6px;
  border-bottom:1px solid var(--border);
  text-align:right;
  white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
th{
  color:var(--muted);
  font-weight:600;
}
.pos{color:var(--green)}
.neg{color:var(--red)}
.na{color:var(--yellow)}
.tag{
  font-size:9px;
  padding:2px 6px;
  border-radius:8px;
  font-weight:800;
  margin-left:6px;
  color:#fff;
  vertical-align:middle;
}
.REAL{background:#1f6f3a}
.ESTIMATED{background:#8a6a0a}
.MODEL{background:#1d4f9b}
.MOCK{background:#6e3a8a}
.kv{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.kv div{
  background:var(--card2);
  border-radius:12px;
  padding:12px;
}
.kv small{
  display:block;
  color:var(--muted);
  font-size:11px;
}
.kv b{font-size:22px}
canvas{max-height:300px}
.warn{
  background:#0b1b3a;
  border:1px solid var(--blue2);
  color:#93c5fd;
  padding:10px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:13px;
}
/* ===== MENÚ GLASS ===== */
nav{
  position:fixed;
  bottom:12px;
  left:12px;
  right:12px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:7px;
  z-index:20;
  background:rgba(7,16,35,.78);
  border:1px solid rgba(96,165,250,.24);
  border-radius:22px;
  box-shadow:0 12px 40px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}

nav button{
  position:relative;
  min-height:58px;
  border:1px solid transparent;
  border-radius:16px;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  transition:all .18s ease;
}

nav button span{
  display:block;
  margin-bottom:3px;
  font-size:19px;
  line-height:1;
  filter:grayscale(.25);
}

nav button:hover{
  color:#bfdbfe;
  background:rgba(59,130,246,.10);
  border-color:rgba(96,165,250,.14);
}

nav button.on{
  color:#eff6ff;
  background:linear-gradient(145deg,rgba(59,130,246,.44),rgba(37,99,235,.24));
  border:1px solid rgba(147,197,253,.42);
  box-shadow:0 7px 20px rgba(37,99,235,.28),inset 0 1px 0 rgba(255,255,255,.20);
  transform:translateY(-3px);
}

nav button.on::before{
  content:"";
  position:absolute;
  top:5px;
  left:22%;
  right:22%;
  height:2px;
  border-radius:10px;
  background:#bfdbfe;
  box-shadow:0 0 10px #60a5fa;
}

nav button.on span{
  filter:none;
  text-shadow:0 0 12px rgba(147,197,253,.72);
}

/* PICKS */
.pick-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}
.pick{
  display:grid;
  grid-template-columns:48px minmax(0,1fr) auto;
  gap:11px;
  align-items:center;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
}
.pick-pos{
  width:44px;
  height:44px;
  border-radius:50%;
  border:2px solid var(--blue);
  background:#0b1b3a;
  color:#93c5fd;
  font-weight:800;
  font-size:13px;
  display:grid;
  place-items:center;
}
.pick-name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pick-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pick-right{
  text-align:right;
  min-width:70px;
}
.pick-tag{
  display:inline-block;
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  padding:4px 6px;
  border-radius:7px;
  background:#123d70;
  color:#93c5fd;
}
.pick-tag.variable{
  background:#543b12;
  color:#facc15;
}
.pick-tag.irregular{
  background:#4b1e25;
  color:#fca5a5;
}
.pick-num{
  display:block;
  font-size:23px;
  font-weight:800;
  color:#bfdbfe;
  margin-top:4px;
}
.pick-unit{
  display:block;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
}

@media(min-width:900px){
  body{padding-bottom:0}
  nav{
    position:sticky;
    top:60px;
    bottom:auto;
    grid-template-columns:repeat(4,160px);
    justify-content:center;
    border:0;
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  nav button{
    border-top:0;
    border-bottom:3px solid transparent;
    font-size:14px;
  }
  nav button span{
    display:inline;
    margin-right:6px;
    font-size:16px;
  }
  nav button.on{border-bottom-color:var(--blue)}
  .sel{
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  .two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .tiles{grid-template-columns:repeat(3,1fr)}
}
/* ===== BRILLO GLASS DE TARJETAS Y MENÚS ===== */

.card{
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(59,130,246,.05),
    0 10px 28px rgba(0,0,0,.30),
    0 0 22px rgba(37,99,235,.10),
    inset 0 1px 0 rgba(255,255,255,.045);
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(147,197,253,.75),
    transparent
  );
  opacity:.75;
  pointer-events:none;
}

.card::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-120px;
  right:-80px;
  background:rgba(59,130,246,.10);
  filter:blur(45px);
  border-radius:50%;
  pointer-events:none;
}

.card:hover{
  border-color:rgba(96,165,250,.30);
  box-shadow:
    0 0 0 1px rgba(59,130,246,.08),
    0 14px 34px rgba(0,0,0,.38),
    0 0 30px rgba(37,99,235,.18),
    inset 0 1px 0 rgba(255,255,255,.07);
}

/* Brillo para los selectores */
select{
  box-shadow:
    0 0 0 1px rgba(59,130,246,.04),
    inset 0 1px 0 rgba(255,255,255,.04),
    0 0 12px rgba(37,99,235,.06);
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

select:hover,
select:focus{
  outline:none;
  border-color:rgba(96,165,250,.60);
  background:rgba(10,23,49,.95);
  box-shadow:
    0 0 0 3px rgba(59,130,246,.10),
    0 0 22px rgba(37,99,235,.28),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* Brillo de la tarjeta rival */
.rival{
  box-shadow:
    0 0 0 1px rgba(59,130,246,.04),
    0 0 18px rgba(37,99,235,.10),
    inset 0 1px 0 rgba(255,255,255,.04);
  transition:box-shadow .2s ease,border-color .2s ease;
}

.rival:hover{
  border-color:rgba(96,165,250,.30);
  box-shadow:
    0 0 0 1px rgba(59,130,246,.08),
    0 0 24px rgba(37,99,235,.22),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* Brillo de la tarjeta principal del jugador */
.phead{
  position:relative;
}

.phead::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;
  width:42%;
  height:1px;
  background:linear-gradient(
    90deg,
    var(--light-blue),
    transparent
  );
  box-shadow:0 0 12px var(--blue);
}

/* Círculos de posición y rival */
.circ,
.pick-pos{
  box-shadow:
    0 0 10px rgba(59,130,246,.28),
    inset 0 0 12px rgba(59,130,246,.10);
}

/* Brillo de mosaicos estadísticos */
.tile{
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  box-shadow:
    0 0 14px rgba(37,99,235,.06),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.tile:hover{
  transform:translateY(-2px);
  border-color:rgba(96,165,250,.38);
  box-shadow:
    0 0 22px rgba(37,99,235,.20),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* Brillo para Picks */
.pick{
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  box-shadow:
    0 0 16px rgba(37,99,235,.07),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.pick:hover{
  transform:translateY(-2px);
  border-color:rgba(96,165,250,.40);
  box-shadow:
    0 0 25px rgba(37,99,235,.22),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* Brillo de la tarjeta de selección */
#t_player>.card:first-child{
  box-shadow:
    0 0 0 1px rgba(59,130,246,.08),
    0 10px 30px rgba(0,0,0,.35),
    0 0 28px rgba(37,99,235,.14),
    inset 0 1px 0 rgba(255,255,255,.06);
}

/* Brillo del botón */
.btn{
  position:relative;
  overflow:hidden;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:55%;
  height:100%;
  background:linear-gradient(
    105deg,
    transparent,
    rgba(255,255,255,.30),
    transparent
  );
  transform:skewX(-20deg);
  transition:left .65s ease;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
  box-shadow:
    0 10px 26px rgba(37,99,235,.40),
    0 0 28px rgba(96,165,250,.24),
    inset 0 1px 0 rgba(255,255,255,.26);
}

.btn:hover::before{
  left:140%;
}

/* Animación muy sutil del brillo */
@keyframes softGlow{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(59,130,246,.06),
      0 0 18px rgba(37,99,235,.10),
      inset 0 1px 0 rgba(255,255,255,.04);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(96,165,250,.12),
      0 0 26px rgba(37,99,235,.18),
      inset 0 1px 0 rgba(255,255,255,.07);
  }
}

#t_player>.card:first-child,
#t_player>.card:nth-child(2){
  animation:softGlow 5s ease-in-out infinite;
}

/* Respeta usuarios que prefieren menos movimiento */
@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<header>
  <div>
    <b>GAVV NFL</b>
    <small>giann</small>
  </div>

  <select id="src" style="width:auto;padding:8px;font-size:13px">
    <option value="nflverse">nflverse (real: historial)</option>
    <option value="mock">MOCK (demo)</option>
    <option value="espn">ESPN (solo juegos/odds)</option>
  </select>
</header>

<nav id="nav">
  <button data-t="stats"><span>📊</span>Estadísticas</button>
  <button data-t="vegas"><span>🎲</span>Vegas 2.0</button>
  <button data-t="player" class="on"><span>👤</span>Jugadores</button>
  <button data-t="picks"><span>⭐</span>Picks</button>
</nav>

<main>
  <div id="t_stats" class="tab"></div>
  <div id="t_vegas" class="tab"></div>

  <div id="t_player" class="tab on">
    <div class="card">
      <h2>Selección</h2>

      <div class="sel">
        <div><label>Semana</label><select id="week"></select></div>
        <div><label>Partido</label><select id="game"></select></div>
        <div><label>Equipo del jugador</label><select id="team"></select></div>
        <div><label>Jugador</label><select id="player"></select></div>
      </div>

      <div class="rival">
        <div class="circ" id="rivalAbbr">—</div>
        <div>
          <small>RIVAL (AUTOMÁTICO)</small>
          <div><b id="rivalName">—</b></div>
        </div>
      </div>

      <button class="btn" id="go">⚡ Proyectar Jugador</button>
    </div>

    <div id="result"></div>
  </div>

  <div id="t_picks" class="tab"></div>
</main>

<script>
const CONFIG={
  season:2026,
  seasonType:2,
  sims:10000,
  propSims:2000,
  envSD:0.12,
  weights:{season:20,recent:20,matchup:20,vegas:20,usage:15,injuries:5},
  script:{
    leagueImplied:22.5,
    rushPerSpreadPt:0.008,
    passPerSpreadPt:0.008,
    volumeElasticity:0.35,
    tdElasticity:1,
    cap:0.25,
    matchupRegress:0.5
  },
  injury:{Healthy:1,Probable:0.99,Questionable:0.95,Doubtful:0.8,Out:0},
  minGames:3
};

const STAT_LABEL={
  pAtt:'Intentos de pase',
  pCmp:'Pases completos',
  pYds:'Yardas de pase',
  pTD:'TD de pase',
  int:'Intercepciones',
  car:'Acarreos',
  rYds:'Yardas de rush',
  rTD:'TD de rush',
  tgt:'Targets',
  rec:'Recepciones',
  recYds:'Yardas de recepción',
  recTD:'TD de recepción'
};

const POS_STATS={
  QB:['pAtt','pCmp','pYds','pTD','int','car','rYds','rTD'],
  RB:['car','rYds','rTD','tgt','rec','recYds','recTD'],
  WR:['tgt','rec','recYds','recTD','car','rYds','rTD'],
  TE:['tgt','rec','recYds','recTD']
};

const MAIN_STAT={QB:'pYds',RB:'rYds',WR:'recYds',TE:'recYds'};
const POS_NAME={QB:'Quarterbacks',RB:'Running backs',WR:'Wide receivers',TE:'Tight ends'};

const CHAINS=[
  {vol:'pAtt',cnt:'pCmp',yds:'pYds',td:'pTD',extra:'int'},
  {vol:'car',yds:'rYds',td:'rTD'},
  {vol:'tgt',cnt:'rec',yds:'recYds',td:'recTD'}
];

const TD_KEYS=['pTD','rTD','recTD'];
const RUSH=['car','rYds','rTD'];
const VOL_STATS=['car','tgt','pAtt'];

const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;

const sd=a=>{
  if(a.length<2)return NaN;
  const m=mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));
};

const sorted=a=>[...a].sort((x,y)=>x-y);
const pct=(s,p)=>s[Math.min(s.length-1,Math.floor(p*s.length))];
const median=a=>{const s=sorted(a);return s.length?pct(s,.5):NaN};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const f=(x,d=1)=>(x==null||isNaN(x))
  ?'<span class="na">Data unavailable</span>'
  :x.toFixed(d);

const P=x=>(x==null||isNaN(x))
  ?'<span class="na">n/a</span>'
  :(x*100).toFixed(0)+'%';

const tag=t=>`<span class="tag ${t}">${t}</span>`;

function rng(seed){
  return()=>{
    seed|=0;
    seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

let R=rng(12345);

const randn=()=>{
  let u=0,v=0;
  while(!u)u=R();
  v=R();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
};

const poisson=l=>{
  if(l<=0)return 0;
  if(l>30)return Math.max(0,Math.round(l+Math.sqrt(l)*randn()));
  const L=Math.exp(-l);
  let k=0,p=1;
  do{k++;p*=R()}while(p>L);
  return k-1;
};

Providers.espn={

  async getGames(week){
    const url=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${CONFIG.season}&seasontype=${CONFIG.seasonType}&week=${week}`;
    const j=await (await fetch(url)).json();

    return (j.events||[]).map(e=>{
      const c=e.competitions[0];
      const H=c.competitors.find(x=>x.homeAway==='home').team;
      const A=c.competitors.find(x=>x.homeAway==='away').team;
      const h=H.abbreviation;
      const a=A.abbreviation;
      const o=c.odds&&c.odds[0];

      let odds=null;

      if(o&&o.overUnder!=null){
        let sp=null;
        const d=(o.details||'').trim();

        if(/^(EVEN|PK|PICK)/i.test(d)){
          sp=0;
        }else{
          const m=d.match(/([A-Z]{2,4})\s*([-+]?\d+\.?\d*)/);
          if(m)sp=(m[1]===h?1:-1)*parseFloat(m[2]);
        }

        const num=v=>{
          const n=parseFloat(v);
          return isNaN(n)?null:n;
        };

        odds={
          spreadHome:sp,
          total:num(o.overUnder),
          mlHome:num(o.moneyline?.home?.close?.odds??o.homeTeamOdds?.moneyLine),
          mlAway:num(o.moneyline?.away?.close?.odds??o.awayTeamOdds?.moneyLine)
        };
      }

      return{
        id:e.id,
        home:h,
        away:a,
        odds,
        name:e.shortName,
        names:{[h]:H.displayName,[a]:A.displayName}
      };
    });
  },

  async getRoster(team){
    try{
      const j=await (await fetch(
        `https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${team}/roster`
      )).json();

      const out=[];

      (j.athletes||[]).forEach(group=>(group.items||[]).forEach(p=>{
        const pos=p.position?.abbreviation;

        if(POS_STATS[pos]){
          out.push({
            id:p.id,
            name:p.fullName||p.displayName||('Jugador '+p.id),
            pos,
            status:(p.injuries&&p.injuries[0]?.status)||'Healthy'
          });
        }
      }));

      return out;
    }catch(e){
      return null;
    }
  },

  async getGameLog(){return null},
  async getDefense(){return null},
  async getProps(){return null}
};

/* ================= MODEL ================= */

function normWeights(w){
  const total=Object.values(w).reduce((a,b)=>a+b,0)||1;
  const out={};
  for(const k in w)out[k]=w[k]/total;
  return out;
}

function vegas(odds,isHome){
  if(!odds||odds.total==null||odds.spreadHome==null)return null;

  const impH=(odds.total-odds.spreadHome)/2;
  const impA=(odds.total+odds.spreadHome)/2;

  const ip=m=>{
    if(m==null)return null;
    return m<0?-m/(-m+100):100/(m+100);
  };

  const pH=ip(odds.mlHome);
  const pA=ip(odds.mlAway);

  let winProb=null;
  if(pH!=null&&pA!=null){
    winProb={
      home:pH/(pH+pA),
      away:pA/(pH+pA)
    };
  }

  return{
    total:odds.total,
    teamSpread:isHome?odds.spreadHome:-odds.spreadHome,
    implied:isHome?impH:impA,
    impliedOpp:isHome?impA:impH,
    winProb:winProb&&(isHome?winProb.home:winProb.away),
    paceIdx:odds.total/(2*CONFIG.script.leagueImplied)
  };
}

function scriptFactor(stat,v){
  const S=CONFIG.script;
  if(!v)return 1;

  const ratio=v.implied/S.leagueImplied;
  const fav=-v.teamSpread;

  if(TD_KEYS.includes(stat)||stat==='int'){
    return clamp(Math.pow(ratio,S.tdElasticity),1-S.cap,1+S.cap);
  }

  const k=RUSH.includes(stat)?S.rushPerSpreadPt:-S.passPerSpreadPt;

  return clamp(
    1+k*fav+S.volumeElasticity*(ratio-1)+S.volumeElasticity*(v.paceIdx-1),
    1-S.cap,
    1+S.cap
  );
}

function matchupFactor(stat,def){
  if(!def||def.allowed[stat]==null||!def.league[stat])return null;
  return 1+CONFIG.script.matchupRegress*(def.allowed[stat]/def.league[stat]-1);
}

function project(stat,ctx){
  const vals=ctx.logs.map(l=>l.stats[stat]).filter(v=>v!=null);

  if(vals.length<CONFIG.minGames)return null;

  const W=normWeights(CONFIG.weights);
  const season=mean(vals);
  const l3=mean(vals.slice(-3));
  const l5=mean(vals.slice(-5));
  const recent=.6*l3+.4*l5;

  const snaps=ctx.logs.map(l=>l.snapPct).filter(v=>v!=null);
  const usageFactor=snaps.length>=3
    ?clamp(mean(snaps.slice(-3))/mean(snaps),.8,1.2)
    :1;

  const mf=matchupFactor(stat,ctx.def);
  const sf=scriptFactor(stat,ctx.vegas);
  const injury=CONFIG.injury[ctx.player.status]??1;

  const comp={
    season,
    recent,
    usage:season*usageFactor,
    matchup:season*(mf??1),
    vegas:season*sf,
    injuries:season*injury
  };

  let projection=0;
  for(const k in W)projection+=W[k]*comp[k];

  const factors={};

  for(const k in W){
    if(k!=='season'){
      factors[k]=season?W[k]*(comp[k]-season)/season:0;
    }
  }

  const deviation=sd(vals);
  const notes=[];

  if(mf==null)notes.push('Matchup: Data unavailable; se usa factor neutro.');
  if(!ctx.vegas)notes.push('Vegas: Data unavailable; se usa factor neutro.');

  return{
    stat,
    proj:projection,
    season,
    l3,
    l5,
    median:median(vals),
    sd:deviation,
    floor:Math.min(...vals),
    ceil:Math.max(...vals),
    n:vals.length,
    vals,
    factors,
    notes,
    cv:season?(deviation/season):1
  };
}

function simulate(proj,pos,ctx,N){
  const keys=POS_STATS[pos];
  const S={};

  const add=k=>S[k]=S[k]||new Float32Array(N);

  keys.forEach(add);
  ['totYds','totTD','anyTD'].forEach(add);

  const chains=CHAINS.filter(c=>keys.includes(c.vol)||keys.includes(c.yds));

  for(let i=0;i<N;i++){
    const environment=Math.exp(CONFIG.envSD*randn()-0.5*CONFIG.envSD**2);

    let totalYards=0;
    let totalTD=0;

    for(const c of chains){
      const pv=proj[c.vol];
      if(!pv)continue;

      const expectedVolume=pv.proj*environment;
      const cvVolume=clamp(pv.cv||.3,.1,.8);

      let volume=expectedVolume<10
        ?poisson(expectedVolume)
        :Math.max(0,Math.round(expectedVolume+cvVolume*expectedVolume*randn()));

      let units=volume;

      if(c.cnt){
        const pc=proj[c.cnt];
        const catchRate=pc?clamp(pc.proj/pv.proj,0,1):.65;

        let count=0;
        for(let j=0;j<volume;j++){
          if(R()<catchRate)count++;
        }

        units=count;

        if(S[c.cnt])S[c.cnt][i]=count;
      }

      if(S[c.vol])S[c.vol][i]=volume;

      const py=proj[c.yds];
      const pu=c.cnt?proj[c.cnt]:pv;

      let yards=0;

      if(py&&pu&&pu.proj>0&&units>0){
        const efficiency=py.proj/pu.proj;
        yards=Math.max(
          0,
          units*efficiency*(1+clamp(py.cv,.15,.6)*.5*randn())
        );
      }

      if(S[c.yds])S[c.yds][i]=yards;
      totalYards+=yards;

      const pt=proj[c.td];
      let touchdowns=0;

      if(pt){
        touchdowns=poisson(
          pt.proj*environment*Math.sqrt(volume/Math.max(expectedVolume/environment,.1))
        );
        if(S[c.td])S[c.td][i]=touchdowns;
      }

      totalTD+=touchdowns;

      if(c.extra&&proj[c.extra]&&S[c.extra]){
        S[c.extra][i]=poisson(proj[c.extra].proj*environment);
      }
    }

    S.totYds[i]=totalYards;
    S.totTD[i]=totalTD;
    S.anyTD[i]=totalTD>0?1:0;
  }

  return S;
}

function summarize(arr,line){
  const s=sorted(arr);
  let over=0;
  let under=0;

  if(line!=null){
    for(const x of arr){
      if(x>line)over++;
      else if(x<line)under++;
    }
  }

  const d=over+under||1;

  return{
    mean:mean(arr),
    median:pct(s,.5),
    p10:pct(s,.1),
    p25:pct(s,.25),
    p50:pct(s,.5),
    p75:pct(s,.75),
    p90:pct(s,.9),
    over:line!=null?over/d:null,
    under:line!=null?under/d:null
  };
}

function confidence(p,edge){
  const n=Math.min(p.n,8)/8;
  const stability=1-Math.min(p.cv,1);
  const signal=p.sd?Math.min(Math.abs(edge)/p.sd,1):0;
  const score=.5*n+.3*stability+.2*signal;

  return score>.6?'Alta':score>.4?'Media':'Baja';
}

async function buildCtx(game,teamAbbr,player,provider){
  const isHome=game.home===teamAbbr;
  const opp=isHome?game.away:game.home;

  const [logs,def,props]=await Promise.all([
    provider.getGameLog(player.id),
    provider.getDefense(opp,player.pos),
    provider.getProps(game.id)
  ]);

  return{
    game,
    team:teamAbbr,
    opp,
    player,
    logs:logs||[],
    def,
    props:props&&props[player.id]||{},
    vegas:vegas(game.odds,isHome),
    hasLogs:!!logs
  };
}

function analyze(ctx,N){
  if(!ctx.hasLogs||ctx.player.status==='Out')return null;

  const proj={};

  POS_STATS[ctx.player.pos].forEach(k=>{
    const p=project(k,ctx);
    if(p)proj[k]=p;
  });

  if(!Object.keys(proj).length)return null;

  const sim=simulate(proj,ctx.player.pos,ctx,N);

  const rows=Object.keys(proj).map(k=>{
    const line=ctx.props[k]??null;
    const sm=summarize(sim[k],line);
    const edge=line!=null?proj[k].proj-line:null;

    return{
      stat:k,
      p:proj[k],
      line,
      edge,
      sim:sm,
      conf:confidence(proj[k],edge??0),
      hit:line!=null
        ?proj[k].vals.filter(v=>v>line).length/proj[k].vals.length
        :null
    };
  });

  const td={};

  TD_KEYS.forEach(k=>{
    if(sim[k]&&proj[k]){
      td[k]=sim[k].reduce((a,b)=>a+(b>0),0)/N;
    }
  });

  return{
    proj,
    sim,
    rows,
    td,
    totals:{
      totYds:summarize(sim.totYds),
      totTD:summarize(sim.totTD),
      anyTD:mean(sim.anyTD)
    }
  };
}

async function setProvider(){
  prov=Providers[$('src').value];
  rosterCache={};

  $('week').innerHTML=opt(
    [...Array(18)].map((_,i)=>i+1),
    w=>`<option ${w===5?'selected':''}>${w}</option>`
  );

  await loadGames();
}

async function loadGames(){
  try{
    games=await prov.getGames($('week').value);
  }catch(e){
    games=[];
  }

  $('game').innerHTML=games.length
    ?opt(games,(g,i)=>`<option value="${i}">${g.name||g.away+' @ '+g.home}</option>`)
    :'<option>Data unavailable</option>';

  await loadTeams();
}

const teamName=(g,t)=>(g&&g.names&&g.names[t])||t;

async function loadTeams(){
  const g=games[$('game').value];

  if(!g){
    $('team').innerHTML='';
    $('player').innerHTML='';
    return;
  }

  $('team').innerHTML=opt(
    [g.home,g.away],
    t=>`<option value="${t}">${teamName(g,t)}</option>`
  );

  await loadPlayers();
}

async function roster(t){
  return rosterCache[t]??(rosterCache[t]=await prov.getRoster(t));
}

async function loadPlayers(){
  const g=games[$('game').value];
  const t=$('team').value;

  if(!g)return;

  const opp=g.home===t?g.away:g.home;

  $('rivalAbbr').textContent=opp;
  $('rivalName').textContent=teamName(g,opp);

  const r=await roster(t);

  if(!r||!r.length){
    $('player').innerHTML='<option value="">Data unavailable</option>';
    return;
  }

  $('player').innerHTML=Object.keys(POS_NAME).map(pos=>{
    const list=r.filter(p=>p.pos===pos);

    return list.length
      ?`<optgroup label="${POS_NAME[pos]}">${
        opt(list,p=>`<option value="${p.id}">${p.name} (${p.pos})</option>`)
      }</optgroup>`
      :'';
  }).join('');
}

function unavailable(msg){
  return `<div class="card">
    <span class="na">Data unavailable</span>
    <div class="disc" style="text-align:left">${msg}</div>
  </div>`;
}

async function run(){
  const g=games[$('game').value];
  const team=$('team').value;
  const r=await roster(team);
  const pl=r&&r.find(p=>p.id===$('player').value);

  if(!g||!pl){
    $('result').innerHTML=unavailable(
      'No hay partido o jugador. Revisa que nfl_data.json esté junto a index.html y usa http://localhost:8000.'
    );
    return;
  }

  $('result').innerHTML='<div class="card disc">Calculando 10,000 simulaciones…</div>';

  const ctx=await buildCtx(g,team,pl,prov);

  if(!ctx.hasLogs){
    $('result').innerHTML=unavailable(
      `El proveedor ${prov.label} no entrega historial para ${pl.name}.`
    );
    return;
  }

  const a=analyze(ctx,CONFIG.sims);

  if(!a){
    $('result').innerHTML=unavailable('Muestra insuficiente de partidos.');
    return;
  }

  LAST={ctx,a,g};

  renderPlayer();
  renderStats();
  renderVegas();
  await renderPicks(g);
}

          borderWidth:2,
          pointRadius:0
        }
      ]
    },
    options:{
      scales:{
        x:{ticks:colTxt,grid:{display:false}},
        y:{
          beginAtZero:true,
          ticks:colTxt,
          grid:{color:'#17233b'}
        }
      },
      plugins:{
        legend:{labels:{color:'#e8f0ff'}}
      }
    }
  });

  /* Distribución: sin números negativos de frecuencia */
  const arr=a.sim[main.stat];
  const maximum=Math.max(...arr,1);
  const bins=Math.min(30,Math.ceil(maximum)+1);
  const binWidth=maximum/bins||1;
  const hist=new Array(bins+1).fill(0);

  arr.forEach(x=>{
    hist[Math.min(bins,Math.floor(x/binWidth))]++;
  });

  chart('cD',{
    type:'bar',
    data:{
      labels:hist.map((_,i)=>(i*binWidth).toFixed(0)),
      datasets:[{
        data:hist.map(x=>x/arr.length*100),
        backgroundColor:'#1d4ed8',
        borderRadius:3
      }]
    },
    options:{
      plugins:{
        legend:{display:false},
        title:{
          display:true,
          text:'Frecuencia de resultados simulados',
          color:'#8aa0bf'
        }
      },
      scales:{
        x:{
          ticks:colTxt,
          grid:{display:false}
        },
        y:{
          display:false,
          beginAtZero:true
        }
      }
    }
  });
}

/* ================= PICKS ================= */

function pickConsistency(p){
  const cv=p.cv??1;

  if(cv<=0.35){
    return{label:'CONSTANTE',className:'constant'};
  }

  if(cv<=0.60){
    return{label:'VARIABLE',className:'variable'};
  }

  return{label:'IRREGULAR',className:'irregular'};
}

async function buildProps(g){
  const rows=[];

  for(const t of [g.home,g.away]){
    const r=await roster(t);

    if(!r)continue;

    for(const pl of r.slice(0,14)){
      const c=await buildCtx(g,t,pl,prov);
      const a=analyze(c,CONFIG.propSims);

      if(!a)continue;

      const mainStat=MAIN_STAT[pl.pos];
      const x=a.rows.find(v=>v.stat===mainStat)||a.rows[0];

      if(!x)continue;

      rows.push({
        name:pl.name,
        pos:pl.pos,
        team:t,
        opp:c.opp,
        opponentName:teamName(g,c.opp),
        stat:x.stat,
        projection:x.p.proj,
        median:x.p.median,
        sd:x.p.sd,
        cv:x.p.cv,
        line:x.line,
        edge:x.edge,
        over:x.sim.over,
        under:x.sim.under,
        consistency:pickConsistency(x.p)
      });
    }
  }

  return rows;
}

async function renderPicks(g){
  $('t_picks').innerHTML=`
    <div class="card">
      <h2>Player projections ${tag(prov.tag)}</h2>

      <div class="warn">
        CONSTANTE, VARIABLE e IRREGULAR se calculan con la variación estadística del jugador.
        Son estimaciones y no garantías.
      </div>

      <select id="sortS">
        <option value="projection">Mayor proyección</option>
        <option value="consistency">Más constantes</option>
        <option value="over">Mayor probabilidad Over</option>
      </select>

      <div id="propsT" style="margin-top:10px">Calculando jugadores…</div>
    </div>
  `;

  window._props=await buildProps(g);
  renderProps();

  $('sortS').onchange=renderProps;
}

function renderProps(){
  const mode=$('sortS').value;
  const rows=(window._props||[]).slice();

  const key={
    projection:r=>r.projection??-1,
    consistency:r=>-(r.cv??1),
    over:r=>r.over??-1
  };

  rows.sort((a,b)=>key[mode](b)-key[mode](a));

  if(!rows.length){
    $('propsT').innerHTML='<span class="na">Data unavailable</span>';
    return;
  }

  $('propsT').innerHTML=`
    <div class="pick-list">
      ${rows.map(r=>`
        <div class="pick">
          <div class="pick-pos">${r.pos}</div>

          <div>
            <div class="pick-name">${r.name}</div>
            <div class="pick-sub">${STAT_LABEL[r.stat]} · vs ${r.opponentName}</div>
          </div>

          <div class="pick-right">
            <span class="pick-tag ${r.consistency.className}">
              ${r.consistency.label}
            </span>
            <span class="pick-num">${r.projection.toFixed(0)}</span>
            <span class="pick-unit">Proyección</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

['stats','vegas','picks'].forEach(t=>{
  $('t_'+t).innerHTML=unavailable(
    'Primero selecciona un jugador en Jugadores y pulsa Proyectar Jugador.'
  );
});

setProvider();
